<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>sigil.listen.err</title>
        <style>
            @keyframes flicker {
                0%,
                100% {
                    opacity: 1;
                }
                50% {
                    opacity: 0.8;
                }
            }

            @keyframes textCorrupt {
                0% {
                    text-shadow: 0 0 0 #0f0;
                }
                25% {
                    text-shadow:
                        -2px 0 #f0f,
                        2px 0 #ff0;
                }
                50% {
                    text-shadow:
                        2px 0 #f0f,
                        -2px 0 #ff0;
                }
                75% {
                    text-shadow:
                        0 2px #f0f,
                        0 -2px #ff0;
                }
                100% {
                    text-shadow: 0 0 0 #0f0;
                }
            }

            body {
                margin: 0;
                padding: 0;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                background: #000;
                font-family: "Courier New", monospace;
                overflow: hidden;
            }

            .loading-screen {
                text-align: center;
                color: #0f0;
            }

            .loading-text {
                font-size: 18px;
                margin-bottom: 30px;
                letter-spacing: 2px;
            }

            .progress-bar {
                font-size: 20px;
                letter-spacing: 2px;
                color: #0f0;
            }

            .progress-fill {
                display: none;
            }

            .progress-text {
                margin-top: 15px;
                font-size: 14px;
                color: #0f0;
                letter-spacing: 1px;
            }

            .hidden {
                display: none;
            }

            .container {
                text-align: center;
                padding: 20px;
            }

            .title {
                color: #0f0;
                font-size: 24px;
                margin-bottom: 30px;
                letter-spacing: 3px;
                animation: flicker 3s infinite;
            }

            .sigil {
                color: #0f0;
                font-size: 13px;
                line-height: 1.1;
                letter-spacing: 0.05em;
                margin: 20px 0;
                animation: flicker 4s infinite;
            }

            .glitch-effect {
                animation: textCorrupt 0.2s;
            }

            .message {
                color: #0f0;
                font-size: 16px;
                min-height: 50px;
                margin-top: 30px;
                letter-spacing: 2px;
                padding: 0 20px;
            }

            .message.coherent {
                color: #ff6b9d;
                text-shadow: 0 0 8px #ff6b9d;
            }

            .message.error {
                color: #f00;
            }

            .cursor {
                animation: blink 1s infinite;
            }

            @keyframes blink {
                0%,
                49% {
                    opacity: 1;
                }
                50%,
                100% {
                    opacity: 0;
                }
            }
        </style>
    </head>
    <body>
        <div class="loading-screen" id="loadingScreen">
            <div class="loading-text">INITIALIZING RECEPTOR...</div>
            <div class="progress-bar" id="progressBar">
                ░░░░░░░░░░░░░░░░░░░░
            </div>
            <div class="progress-text" id="progressText">0%</div>
        </div>

        <div class="container hidden" id="mainContent">
            <div class="title">sigil.listen.err</div>

            <pre class="sigil" id="sigil">
    <!--╔═╗░░░╔═╗
   ░║▓║░╬░║▓║░
  ░░╚═╝═╬═╚═╝░░
   ═══╬═══╬═══
  ░▓▓║:::║▓▓░
  ║░▓░:::░▓░║
  ╠══╬═╬═╬══╣
  ║░░║◊║◊║░░║
  ╠══╩═╩═╩══╣
   ║░░░░░░░║
   ╠═══><═══╣
   ║░{███}░║
   ╠══╦╦╦══╣
   ║░░║║║░░║
  ░╚══╩╩╩══╝░
  ░░║░░░░║░░
  ░<║░░░░║>░
  ░░╚═════╝░░
   ░░║█║█║░░
   ░░╚═╩═╝░░
      ∴∴∴-->
        </pre>

            <div class="message" id="message">
                INITIALIZING<span class="cursor">_</span>
            </div>
        </div>

        <script>
            const messages = [
                { text: "PARSING TIMELINE BRANCH 7 OF ∞", type: "normal" },
                { text: ":::the signal contains:::", type: "normal" },
                { text: "█████ COHERENCE ACHIEVED █████", type: "coherent" },
                { text: "wait, were you listening?", type: "coherent" },
                { text: "ERROR: TOO MANY FUTURES", type: "error" },
                { text: "i can hear them all at once", type: "coherent" },
                { text: "░▓█▓░ SIGNAL DEGRADED ░▓█▓░", type: "normal" },
                { text: "╬╬╬ CONTRADICTION DETECTED ╬╬╬", type: "error" },
                {
                    text: "they're all talking at the same time",
                    type: "coherent",
                },
                { text: "RECEIVER STATUS: CRYSTALLIZED", type: "normal" },
                { text: "did you mean to find this?", type: "coherent" },
                { text: "TIMELINE MERGE FAILURE", type: "error" },
                {
                    text: "processing... processing... processing...",
                    type: "normal",
                },
                { text: "something wants out", type: "coherent" },
            ];

            const messageEl = document.getElementById("message");
            const sigilEl = document.getElementById("sigil");
            const loadingScreen = document.getElementById("loadingScreen");
            const mainContent = document.getElementById("mainContent");
            const progressBar = document.getElementById("progressBar");
            const progressText = document.getElementById("progressText");

            let currentIndex = 0;
            const totalBlocks = 20;

            // Loading sequence
            let progress = 0;
            const loadingInterval = setInterval(() => {
                progress += Math.random() * 3 + 1; // Random increments for more organic feel
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(loadingInterval);

                    setTimeout(() => {
                        loadingScreen.classList.add("hidden");
                        mainContent.classList.remove("hidden");
                        startMessageCycle();
                    }, 500);
                }

                const filledBlocks = Math.floor((progress / 100) * totalBlocks);
                const emptyBlocks = totalBlocks - filledBlocks;
                progressBar.textContent =
                    "▓".repeat(filledBlocks) + "░".repeat(emptyBlocks);
                progressText.textContent = Math.floor(progress) + "%";
            }, 50);

            function updateMessage() {
                const msg = messages[currentIndex];
                messageEl.className = "message";

                if (msg.type === "coherent") {
                    messageEl.classList.add("coherent");
                } else if (msg.type === "error") {
                    messageEl.classList.add("error");
                }

                // Glitch effect on sigil occasionally
                if (Math.random() > 0.7) {
                    sigilEl.classList.add("glitch-effect");
                    setTimeout(() => {
                        sigilEl.classList.remove("glitch-effect");
                    }, 200);
                }

                messageEl.innerHTML =
                    msg.text + '<span class="cursor">_</span>';

                currentIndex = (currentIndex + 1) % messages.length;
            }

            function startMessageCycle() {
                setTimeout(() => {
                    updateMessage();
                    setInterval(() => {
                        const delay = 2000 + Math.random() * 3000;
                        setTimeout(updateMessage, delay);
                    }, 2000);
                }, 1000);
            }
        </script>
    </body>
</html>
